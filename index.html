
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>WebAR Gold Robot</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      width: max-content;
      max-width: 85%;
    }
  </style>
</head>

<body>
  <div id="status">Halakan kamera kepada marker Hiro</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true; antialias: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets timeout="15000">
      <a-asset-item
        id="robotModel"
        src="./models/robot-gold.glb">
      </a-asset-item>
    </a-assets>

    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smoothCount="5">

      <a-entity
        id="goldRobot"
        gltf-model="#robotModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        animation="property: rotation;
                   to: 0 360 0;
                   dur: 4000;
                   easing: linear;
                   loop: true">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.getElementById("hiroMarker");
    const status = document.getElementById("status");
    const robot = document.getElementById("goldRobot");

    marker.addEventListener("markerFound", () => {
      status.textContent = "Robot Gold dikesan!";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent = "Halakan kamera kepada marker Hiro";
    });

    robot.addEventListener("model-loaded", () => {
      status.textContent = "Model robot berjaya dimuatkan";
    });

    robot.addEventListener("model-error", () => {
      status.textContent = "Gagal memuatkan robot-gold.glb";
    });
  </script>
</body>
</html>
